name: agenticops-agent
arch: all
platform: linux
version: ${VERSION}
maintainer: AgenticOp-io <opensource@agenticop.io>
description: AgenticOps cloud agent. Runs the jobs an AgenticOps Desk sends, using the agent file that desk made for it.
homepage: https://agenticop.io
license: Apache-2.0
depends:
  - git
recommends:
  - nodejs
contents:
  - src: agenticops-agent
    dst: /usr/bin/agenticops-agent
    file_info: { mode: 0755 }
  - src: agenticops-agent.service
    dst: /usr/lib/systemd/system/agenticops-agent.service
    file_info: { mode: 0644 }
  - src: agent.env
    dst: /etc/agenticops-agent/agent.env
    type: config|noreplace
    file_info: { mode: 0600 }
scripts:
  postinstall: postinstall.sh
  preremove: preremove.sh
