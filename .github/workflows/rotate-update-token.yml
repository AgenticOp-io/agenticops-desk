name: Rotate update token

# A sealed GitHub App key mints a one-hour token on every update check. This job mints one
# on a schedule so a revoked key fails here instead of only on a user's machine.
# A sealed PAT cannot be reissued by the API. The job fails when that token expires within 14 days.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Mint and confirm the credential can read the repository
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
          UPDATE_APP_ID: ${{ secrets.UPDATE_APP_ID }}
          UPDATE_APP_INSTALLATION_ID: ${{ secrets.UPDATE_APP_INSTALLATION_ID }}
          UPDATE_APP_PRIVATE_KEY: ${{ secrets.UPDATE_APP_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/rotate-update-token.mjs
