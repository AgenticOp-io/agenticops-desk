name: Release

# Packages AgenticOps Desk for Windows, macOS and Linux. The installers do not contain the
# Claude Code binary; the app downloads the build for that computer on first launch.
# One runner per operating system packages both chip types. A v* tag publishes every
# built file as a beta prerelease. Drafts are not used: an installed copy cannot see them.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows, os: windows-latest, args: --win --x64 --arm64 }
          - { label: linux, os: ubuntu-latest, args: --linux --x64 --arm64 }
          - { label: mac, os: macos-latest, args: --mac --x64 --arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Bundle
        # Monaco makes the bundle large; Node's default heap runs out on the runner.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Build the code patch
        if: matrix.label == 'windows'
        env:
          PATCH_SIGNING_KEY: ${{ secrets.PATCH_SIGNING_KEY }}
        run: node scripts/make-patch.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: AgenticOps-Desk-${{ matrix.label }}
          # Only a hand-off to the publish job; the release keeps the installers. Longer filled the storage quota.
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/patch*

  release:
    name: Beta release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --prerelease --title "AgenticOps Desk ${GITHUB_REF_NAME} beta" --notes "Beta. Every Windows, macOS and Linux build is attached. Installed copies check the git tags of this private repository."
      - name: Keep only this release
        env:
          GH_TOKEN: ${{ github.token }}
        # One installation updates from the newest release; older ones only take up space. Git tags stay.
        run: |
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName --jq '.[].tagName' |
            grep -vx "${GITHUB_REF_NAME}" |
            xargs -r -n1 gh release delete --repo "${GITHUB_REPOSITORY}" --yes
