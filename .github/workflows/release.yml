name: Release

# Packages AgenticOps Desk for Windows, macOS and Linux. The installers do not contain the
# Claude Code binary; the app downloads the build for that computer on first launch.
# One runner per operating system packages both chip types. Run it by hand, or push a
# v* tag to also attach the files to a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows, os: windows-latest, args: --win --x64 --arm64 }
          - { label: linux, os: ubuntu-latest, args: --linux --x64 --arm64 }
          - { label: mac, os: macos-latest, args: --mac --x64 --arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Bundle
        # Monaco makes the bundle large; Node's default heap runs out on the runner.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Keep one Windows installer and one portable
        # The all-in-one files carry x64 and ARM64 and pick the right one on the PC; the single-chip copies are dropped.
        if: matrix.label == 'windows'
        shell: bash
        run: rm -f release/*-win-x64-*.exe release/*-win-arm64-*.exe
      - name: Build the code patch
        if: matrix.label == 'windows'
        env:
          PATCH_SIGNING_KEY: ${{ secrets.PATCH_SIGNING_KEY }}
        run: node scripts/make-patch.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: AgenticOps-Desk-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/patch*

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --draft --title "AgenticOps Desk ${GITHUB_REF_NAME}" --generate-notes
