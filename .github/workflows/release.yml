name: Release

# Packages AgenticOps Desk for Windows, macOS and Linux. The installers do not contain the
# Claude Code binary; the app downloads the build for that computer on first launch.
# One runner per operating system packages both chip types. A v* tag publishes every
# built file as a beta prerelease. Each build attaches its files straight to a draft release, which is
# published once all three finish: Actions artifacts counted against a storage quota that 400 MB
# installers filled, and a full quota fails every build. The draft exists only while the builds run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft --prerelease --title "AgenticOps Desk ${GITHUB_REF_NAME} beta" --notes "Beta. Every Windows, macOS and Linux build is attached. Installed copies check the git tags of this private repository."

  build:
    name: ${{ matrix.label }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows, os: windows-latest, args: --win --x64 --arm64 }
          - { label: linux, os: ubuntu-latest, args: --linux --x64 --arm64 }
          - { label: mac, os: macos-latest, args: --mac --x64 --arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Bundle
        # Monaco makes the bundle large; Node's default heap runs out on the runner.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Build the code patch
        if: matrix.label == 'windows'
        env:
          PATCH_SIGNING_KEY: ${{ secrets.PATCH_SIGNING_KEY }}
        run: node scripts/make-patch.mjs
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/patch*)
          [ ${#files[@]} -gt 0 ] || { echo "Nothing was built"; exit 1; }
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber

  release:
    name: Beta release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
      - name: Keep only the three newest published releases
        env:
          GH_TOKEN: ${{ github.token }}
        # Keep the newest release and the two before it; older binaries only take up space. Git tags stay.
        # Drafts are never touched, so a release still being built is not clobbered by a concurrent run.
        run: |
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' |
            sort -rV | tail -n +4 |
            while read -r tag; do
              gh release delete "$tag" --repo "${GITHUB_REPOSITORY}" --yes
            done
